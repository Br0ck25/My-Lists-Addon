name: D1 backup

# A daily off-Cloudflare copy of the production D1 databases (task P1-B1).
# D1 Time Travel already gives 30 days of point-in-time restore on Workers
# Paid; this is the copy that survives losing a database itself.
#
# Each database is read table by table with ordinary queries
# (.github/scripts/d1-backup.mjs), not `wrangler d1 export`: D1 refuses to
# export a database with virtual tables -- the main database has two, the
# full-text search tables -- and an export blocks every other request to the
# database while it runs.
#
# The dumps hold every account's data, and this repository's Actions artifacts
# can be downloaded by other people, so each dump is encrypted before it is
# uploaded and the job refuses to run without a passphrase. Restore steps are
# in docs/OPERATIONS.md §5.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN     an API token with "D1: Read" on the account
#   CLOUDFLARE_ACCOUNT_ID    the account id
#   D1_DATABASE_ID           my-lists-db's id (D1 -> my-lists-db -> overview)
#   ACTIVITY_D1_DATABASE_ID  mylists-activity's id (watch history lives only
#                            there since FF_EVENT_TRACKING)
#   BACKUP_PASSPHRASE        a long random passphrase, also kept somewhere safe
#                            outside GitHub -- without it a backup is unreadable

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      ACTIVITY_D1_DATABASE_ID: ${{ secrets.ACTIVITY_D1_DATABASE_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # A missing secret fails the run. It used to pass with a warning, which
      # showed a green tick every day while nothing was copied (2026-09-30 to
      # 2026-10-04: every run skipped). Watch history lives only in
      # mylists-activity since FF_EVENT_TRACKING, so its id is required too.
      - name: Check the secrets are set
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID ACTIVITY_D1_DATABASE_ID BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::No backup was made. Missing repository secrets:$missing (see docs/OPERATIONS.md §5)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read and encrypt
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y-%m-%dT%H%MZ)"
          dump() {
            local name="$1" id="$2"
            node .github/scripts/d1-backup.mjs "$id" "backup/${name}-${stamp}.sql"
            test -s "backup/${name}-${stamp}.sql"
            gzip -9 "backup/${name}-${stamp}.sql"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "backup/${name}-${stamp}.sql.gz"
            # Only the encrypted file leaves this runner.
            rm -f "backup/${name}-${stamp}.sql.gz"
            # Prove the kept file opens: decrypt it with the passphrase, load
            # it into an empty database, and compare every table's row count.
            mkdir -p check
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --decrypt "backup/${name}-${stamp}.sql.gz.gpg" | gunzip > "check/${name}.sql"
            node .github/scripts/d1-backup-verify.mjs "check/${name}.sql" "backup/${name}-${stamp}.sql.counts.json"
            rm -f "check/${name}.sql" "backup/${name}-${stamp}.sql.counts.json"
          }
          dump my-lists-db "$D1_DATABASE_ID"
          dump mylists-activity "$ACTIVITY_D1_DATABASE_ID"
          ls -l backup

      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup/*.sql.gz.gpg
          if-no-files-found: error
          retention-days: 30
