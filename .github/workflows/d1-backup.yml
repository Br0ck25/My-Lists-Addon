name: D1 backup

# A daily off-Cloudflare copy of the production D1 databases (task P1-B1).
# D1 Time Travel already gives 30 days of point-in-time restore on Workers
# Paid; this is the copy that survives losing a database itself.
#
# Each database is read table by table with ordinary queries
# (.github/scripts/d1-backup.mjs), not `wrangler d1 export`: D1 refuses to
# export a database with virtual tables -- the main database has two, the
# full-text search tables -- and an export blocks every other request to the
# database while it runs.
#
# The dumps hold every account's data, and this repository's Actions artifacts
# can be downloaded by other people, so each dump is encrypted before it is
# uploaded and the job refuses to run without a passphrase. Restore steps are
# in docs/OPERATIONS.md §5.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN     an API token with "D1: Read" on the account
#   CLOUDFLARE_ACCOUNT_ID    the account id
#   D1_DATABASE_ID           my-lists-db's id (D1 -> my-lists-db -> overview)
#   ACTIVITY_D1_DATABASE_ID  mylists-activity's id (watch history since
#                            FF_EVENT_TRACKING). Optional: left out, only the
#                            main database is copied.
#   BACKUP_PASSPHRASE        a long random passphrase, also kept somewhere safe
#                            outside GitHub -- without it a backup is unreadable

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      ACTIVITY_D1_DATABASE_ID: ${{ secrets.ACTIVITY_D1_DATABASE_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::D1 backup skipped. Missing repository secrets:$missing (see docs/OPERATIONS.md §5)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$ACTIVITY_D1_DATABASE_ID" ]; then
            echo "::warning::ACTIVITY_D1_DATABASE_ID is not set: watch history (mylists-activity) is not being copied."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Read and encrypt
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y-%m-%dT%H%MZ)"
          dump() {
            local name="$1" id="$2"
            node .github/scripts/d1-backup.mjs "$id" "backup/${name}-${stamp}.sql"
            test -s "backup/${name}-${stamp}.sql"
            gzip -9 "backup/${name}-${stamp}.sql"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "backup/${name}-${stamp}.sql.gz"
            # Only the encrypted file leaves this runner.
            rm -f "backup/${name}-${stamp}.sql.gz"
          }
          dump my-lists-db "$D1_DATABASE_ID"
          if [ -n "$ACTIVITY_D1_DATABASE_ID" ]; then
            dump mylists-activity "$ACTIVITY_D1_DATABASE_ID"
          fi
          ls -l backup

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup/*.sql.gz.gpg
          if-no-files-found: error
          retention-days: 30
