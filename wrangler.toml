name = "my-lists-addon"
main = "worker_entry_combined.js"
compatibility_date = "2024-01-01"

# --- KV (REQUIRED) -----------------------------------------------------------
# Every stateful feature depends on this binding: Creator Profiles, cloud
# sync, published lists, likes, feedback, analytics, and all catalog
# caching. Without it the Worker still boots and serves pages, but each of
# those silently degrades to a no-op -- it does NOT fail loudly, so a
# missing binding is easy to miss.
#
# Create one and paste the id it prints:
#   npx wrangler kv namespace create CONFIGS
[[kv_namespaces]]
binding = "CONFIGS"
id = "YOUR_KV_NAMESPACE_ID"

# --- D1 (REQUIRED) -----------------------------------------------------------
# Required. D1 is the primary authoritative store for Creator Profiles, lists,
# full-text search (lists_fts), likes ledgers, feedback, tracking, and counters.
#
# For a NEW database: create it, run schema.sql (the complete current schema,
# non-destructive), and fill in the database_id. An existing database is
# changed only by the files in migrations/ -- see docs/OPERATIONS.md.
#   npx wrangler d1 create my-lists-db
#   npx wrangler d1 execute my-lists-db --file=./schema.sql
#
# If deploying an existing site with data in KV, run the "Migrate KV -> D1"
# tool in /admin's Maintenance tab to backfill your records into D1.
[[d1_databases]]
binding = "DB"
database_name = "my-lists-db"
database_id = "YOUR_DATABASE_ID"

# --- Analytics Engine (recommended) ------------------------------------------
# One data point per request: route, status, duration, and the KV and D1
# operations it made. The code writes to it only when the binding exists.
# Dashboard: Worker -> Settings -> Bindings -> Add -> Analytics Engine,
# name ANALYTICS, dataset mylists_events. See docs/OPERATIONS.md.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mylists_events"

# --- R2 (recommended from Phase 3b) ----------------------------------------------
# Shared channels' episode lists, one object per version
# (channels/{code}/{version}.json, P3b-8). Without it the channel rows are
# still written and episodes are read from KV.
# Dashboard: R2 -> Create bucket mylists-blobs, then Worker -> Settings ->
# Bindings -> Add -> R2 bucket, name BLOBS, bucket mylists-blobs.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "mylists-blobs"

# --- Plan ---------------------------------------------------------------------
# The hosted Worker runs on Workers Paid (10,000 outbound fetches and 30 s CPU
# per invocation). The old per-invocation budgets that let it fit the Free
# plan -- BULK_RESOLVE_SUBREQUEST_BUDGET, DETAILS_BATCH_SUBREQUEST_BUDGET and
# CRON_SUBREQUEST_BUDGET -- were removed; the code ignores them, and they can
# be deleted from the dashboard's Variables and Secrets.
#
# Deploying by pasting into the Cloudflare dashboard? None of this file is
# read: bindings, variables, secrets and the cron trigger are set in the
# dashboard. This file is for `wrangler dev` and CI.
[vars]
# Optional. "justwatch" (default, no key needed) or "rapidapi".
# NEW_ON_STREAMING_ENGINE = "justwatch"
# Optional feature flag for Phase 3a: session auth and dual-auth compatibility
# FF_SESSIONS = "1"
# Optional feature flag for Phase 3a: the /api/installs management API
# FF_INSTALLS = "1"
# Optional feature flag for Phase 3b: read lists from the v2 tables. Leave
# unset until the list copy has finished (docs/OPERATIONS.md sections 9 and 10).
# FF_V2_LISTS_READ = "1"
# Optional feature flag for Phase 3b: the /api/lists list API and /api/likes.
# Leave unset in production until the legacy list writes stop (P3b-9).
# FF_V2_LISTS_API = "1"
# Optional, 0-100: share of existing install links whose keys and tokens are
# moved into encrypted D1 storage on first use (needs TOKEN_ENCRYPTION_KEY)
# INSTALL_MIGRATION_PERCENT = "0"

# --- Cron trigger (REQUIRED for Continue Watching) ---------------------------
# Drives the scheduled() export at the bottom of
# 26_api-creator-and-admin-routes.js: checkForNewEpisodes() sweeps creator
# accounts for newly-aired episodes and pushes them into Continue Watching,
# and prewarmSharedCatalogs() refreshes the shared Trakt/TMDB/Simkl/MDBList
# charts into KV.
#
# Without this block scheduled() never runs at all -- Continue Watching
# never picks up new episodes and the shared charts are never pre-warmed,
# with no error anywhere to indicate why.
#
# "*/6 * * * *" is every 6 MINUTES, which matches the README's setup step
# and is driven by prewarmSharedCatalogs: keeping the shared Trakt / TMDB /
# Simkl / MDBList charts hot in KV is what keeps catalog loads fast for
# every visitor and keeps the Worker off those providers' rate limits.
# checkForNewEpisodes rides along on the same tick but is internally
# cursor-paginated (one slice of accounts per run), so the per-account
# episode sweep does NOT actually run 240x/day per account.
#
# If you do not use Continue Watching and want to minimise invocations,
# "0 */6 * * *" (every 6 hours) is a reasonable alternative -- but expect
# colder catalogs and more upstream API calls.
[triggers]
crons = ["*/6 * * * *"]

# --- Secrets (set these with `wrangler secret put`, never in this file) ------
#
# Required for the admin dashboard at /admin:
#   npx wrangler secret put ADMIN_KEY
#
# Provider API keys. All optional -- each feature gated on one degrades to
# a clear in-app message when its key is absent, rather than crashing:
#   npx wrangler secret put TMDB_API_KEY            # themoviedb.org/settings/api
#   npx wrangler secret put RAPIDAPI_KEY            # rapidapi.com (Streaming Availability API for New on Streaming)
#   npx wrangler secret put STREAMING_AVAILABILITY_API_KEY # optional alias for RAPIDAPI_KEY
#
# New on Streaming reads JustWatch's "new" feed by default (no key needed).
# To use RapidAPI instead, set the plain var NEW_ON_STREAMING_ENGINE = "rapidapi"
# under [vars].
#   npx wrangler secret put TRAKT_CLIENT_ID         # trakt.tv/oauth/applications
#   npx wrangler secret put TRAKT_CLIENT_SECRET     # required only for Trakt OAuth login
#   npx wrangler secret put MDBLIST_API_KEY         # mdblist.com/preferences
#   npx wrangler secret put MDBLIST_POPULAR_KEY     # optional, for the Toplists proxy
#   npx wrangler secret put MDBLIST_CLIENT_ID       # required only for MDBList OAuth
#   npx wrangler secret put MDBLIST_CLIENT_SECRET   # required with the id above; OAuth fails without it
#   npx wrangler secret put SIMKL_CLIENT_ID         # simkl.com/settings/developer/
#   npx wrangler secret put SIMKL_CLIENT_SECRET     # required only for Simkl OAuth
#
# Phase 3a encryption & blind-index secrets:
#   npx wrangler secret put TOKEN_ENCRYPTION_KEY    # k1:<32-bytes-base64> for AES-GCM token storage
#   npx wrangler secret put LOOKUP_PEPPER           # Pepper for HMAC blind index lookups
